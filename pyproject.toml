[project]
name = "ghost-downloader-cli"
version = "0.1.0"
description = "Headless command-line frontend for Ghost-Downloader-3 (unofficial)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "guyiicn" }]
dependencies = [
    # Keep in sync with upstream/pyproject.toml (minus GUI-only deps).
    "aioftp[socks]>=0.27.2",
    "loguru>=0.7.3",
    "m3u8>=6.0.0",
    "mpegdash>=0.4.1",
    "qrcode[png]>=8.2",
    "websockets>=14",
    "wreq==0.12.3",  # 0.13 breaks the engine — pinned until upstream bumps
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "winloop>=0.6.0; sys_platform == 'win32'",
    # GUI stack: qfluentwidgets pulls PySide6, but headless only imports its
    # config classes (no QApplication). Cheaper than vendoring a fake Qt.
    # NOTE: pip name is PySide6-Fluent-Widgets; import name is qfluentwidgets.
    "PySide6-Fluent-Widgets>=1.11.2",
]

[project.scripts]
gd-cli = "cli.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cli"]
